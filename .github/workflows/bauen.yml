# Baut die Installer fuer Windows und Mac, sobald eine Version markiert wird
# (git tag v0.2.0 && git push --tags). Die Dateien landen auf GitHub unter
# "Releases" und lassen sich dort herunterladen.
name: Installer bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dateien: ausgabe/*.exe
          - os: macos-latest
            dateien: ausgabe/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer hochladen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Kranich $GITHUB_REF_NAME" --notes "Installer für Windows und Mac. Ohne gekauftes Zertifikat warnt das System beim ersten Start."
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.dateien }} --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kranich-${{ matrix.os }}
          path: ${{ matrix.dateien }}
