# Baut die Installer fuer Kranich (Windows und Mac)
# Token fuer das Download-Repo: Secret DOWNLOAD_TOKEN
# und legt sie auf GitHub unter
# "Releases" ab. Laeuft, sobald sich die Versionsnummer in package.json
# aendert (oder von Hand ueber "Run workflow").
name: Installer bauen

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/bauen.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dateien: ausgabe/*.exe
          - os: macos-latest
            dateien: ausgabe/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kranich-${{ matrix.os }}
          path: ${{ matrix.dateien }}
      - name: Installer als Release ablegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --target "$GITHUB_SHA" --title "Kranich $VERSION" --notes "Kranich, die Entwurfsmaschine der origami-Familie. Ohne gekauftes Zertifikat warnt das System beim ersten Start." || true
          for versuch in 1 2 3; do
            gh release upload "$VERSION" ${{ matrix.dateien }} --clobber && break
            sleep 10
          done
      - name: Ins oeffentliche Download-Repo legen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "Kein DOWNLOAD_TOKEN"; exit 0; }
          TAG="kranich-v$(node -p "require('./package.json').version")"
          R=sirseagull69/selbst-gfaltet-downloads
          gh api repos/$R/commits -q '.[0].sha' >/dev/null 2>&1 || gh api -X PUT repos/$R/contents/README.md -f message="Start" -f content="$(printf '# Selbst gfaltet - Downloads\n\nInstaller von Kranich, Albatros und dem Startfenster.\n' | base64 | tr -d '\n')" || true
          gh release view "$TAG" -R $R >/dev/null 2>&1 || gh release create "$TAG" -R $R --title "Kranich ${TAG##*-v}" --notes "Kranich" || true
          for versuch in 1 2 3; do
            gh release upload "$TAG" -R $R ${{ matrix.dateien }} --clobber && break
            sleep 10
          done
