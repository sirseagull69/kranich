# Baut die Installer fuer Windows und Mac und legt sie auf GitHub unter
# "Releases" ab. Laeuft, sobald sich die Versionsnummer in package.json
# aendert (oder von Hand ueber "Run workflow").
name: Installer bauen

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/bauen.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dateien: ausgabe/*.exe
          - os: macos-latest
            dateien: ausgabe/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kranich-${{ matrix.os }}
          path: ${{ matrix.dateien }}
      - name: Installer als Release ablegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --target "$GITHUB_SHA" --title "Kranich $VERSION" --notes "Installer für Windows und Mac. Ohne gekauftes Zertifikat warnt das System beim ersten Start." || true
          for versuch in 1 2 3; do
            gh release upload "$VERSION" ${{ matrix.dateien }} --clobber && break
            sleep 10
          done
