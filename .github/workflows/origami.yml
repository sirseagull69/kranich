# Baut origami (Windows und Mac), Release origami-v<version>.
name: origami bauen

on:
  push:
    branches: [main]
    paths: ['origami/**', '.github/workflows/origami.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dateien: ausgabe/*.exe
          - os: macos-latest
            dateien: ausgabe/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: origami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Als Release ablegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="origami-v$(node -p "require('./package.json').version")"
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --target "$GITHUB_SHA" --latest=false --title "origami ${VERSION#origami-}" --notes "origami – dein KI-Assistent als App." || true
          for versuch in 1 2 3; do
            gh release upload "$VERSION" ${{ matrix.dateien }} --clobber && break
            sleep 10
          done
      - name: Ins oeffentliche Download-Repo legen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "Kein DOWNLOAD_TOKEN"; exit 0; }
          TAG="origami-v$(node -p "require('./package.json').version")"
          R=sirseagull69/selbst-gfaltet-downloads
          gh api repos/$R/commits -q '.[0].sha' >/dev/null 2>&1 || gh api -X PUT repos/$R/contents/README.md -f message="Start" -f content="$(printf '# Selbst gfaltet - Downloads\n\nInstaller von Kranich, Albatros und dem Startfenster.\n' | base64 | tr -d '\n')" || true
          gh release view "$TAG" -R $R >/dev/null 2>&1 || gh release create "$TAG" -R $R --title "origami ${TAG##*-v}" --notes "origami" || true
          for versuch in 1 2 3; do
            gh release upload "$TAG" -R $R ${{ matrix.dateien }} --clobber && break
            sleep 10
          done
