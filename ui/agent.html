<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500;font-display:swap;src:url('schrift/bricolage-grotesque-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:700;font-display:swap;src:url('schrift/bricolage-grotesque-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url('schrift/bricolage-grotesque-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:400;font-display:swap;src:url('schrift/source-serif-4-latin-400-normal.woff2') format('woff2')}

html,body{height:100%;margin:0;overflow:hidden;background:#fffdf8}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #4a2f9a;outline-offset:2px}

<body>
<div id="app"></div>
<template id="vorlage"><div><sc-if value="{{ sStatus }}"><div style="position: relative; width: 100vw; height: 100vh; padding: 20px 24px 18px; background: #fffdf8; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; color: #1d2742; font-family: 'Source Serif 4', Georgia, serif; font-size: 13.5px; line-height: 1.45"><div style="display: flex; align-items: center; gap: 12px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="92" height="92" role="img" aria-label="Kranich steht ruhig" style="display: block; flex: none"><ellipse cx="46" cy="87" rx="18" ry="2.4" fill="#1d2742" opacity="0.14"></ellipse><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0;0 -1.6;0 0" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" repeatCount="indefinite"></animateTransform><polygon points="40,58 43,58 41,86" fill="#6243c4"></polygon><polygon points="48,58 51,58 52,86" fill="#6243c4"></polygon><polygon points="12,50 30,46 30,58" fill="#4a2f9a"></polygon><polygon points="24,58 62,58 46,38" fill="#7c5cd6"></polygon><polygon points="56,56 62,58 66,22" fill="#4a2f9a"><animate attributeName="points" values="56,56 62,58 66,22;56,56 62,58 66,22;56,56 62,58 68,25;56,56 62,58 68,25;56,56 62,58 66,22;56,56 62,58 66,22" keyTimes="0;0.6;0.68;0.8;0.88;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" repeatCount="indefinite"></animate></polygon><polygon points="30,52 56,55 38,32" fill="#d6caf9"></polygon><polygon points="66,22 80,27 65,29" fill="#1d2742"><animate attributeName="points" values="66,22 80,27 65,29;66,22 80,27 65,29;68,25 81,33 66,32;68,25 81,33 66,32;66,22 80,27 65,29;66,22 80,27 65,29" keyTimes="0;0.6;0.68;0.8;0.88;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" repeatCount="indefinite"></animate></polygon></g></svg><div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start; min-width: 0"><div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.1">{{ name }}</h1><svg viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 10px"><path d="M2 4 C40 1 80 7 120 3 S180 5 198 3" fill="none" stroke="#7c5cd6" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"></path><path d="M10 9 C60 7 110 11 170 8" fill="none" stroke="#d6caf9" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></div><span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; white-space: nowrap; transition: background .3s, color .3s; background: {{ chip.bg }}; color: {{ chip.fg }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none"><path d="{{ chip.ico }}"></path></svg>{{ chip.text }}</span></div></div><sc-if value="{{ fundAn }}"><div style="filter: drop-shadow(0 1px 1px rgba(30,40,70,.22)); min-width: 0"><div style="background: #ffffff; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 800; font-size: 15px; overflow-wrap: anywhere">{{ fund.name }}</span><span style="color: #4a4f5e">{{ fund.zeile }}</span><span>{{ fund.text }}</span></div></div></sc-if><sc-if value="{{ hinweisAn }}"><div style="display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; background: #ecebe6; border-radius: 3px"><span style="color: #4a4f5e; padding-top: 1px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none"><path d="M4 4l16 16M8.5 8.6A6 6 0 0 0 6 13M12 7a6 6 0 0 1 6 6M12 17v.5"></path></svg></span><span>{{ hinweis }}</span></div></sc-if><div style="display: flex; flex-direction: column"><sc-for list="{{ zeilen }}" as="z"><div style="display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px dashed #d9d0bc; color: {{ z.fg }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none"><path d="{{ z.ico }}"></path></svg><span>{{ z.text }}</span></div></sc-for></div><sc-if value="{{ gekoppelt }}"><div style="display: flex; gap: 8px"><button type="button" onClick="{{ scan }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 3px; background: #6243c4; color: #ffffff; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 14.5px; font-weight: 700; white-space: nowrap; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); flex: 1 1 0; padding: 0 10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"></path></svg>Jetzt scannen</button><button type="button" onClick="{{ probe }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border: 1.5px solid #1d2742; border-radius: 3px; background: #fffdf8; color: #1d2742; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; white-space: nowrap; flex: 1 1 0; min-height: 44px; padding: 0 10px">Probealarm</button></div></sc-if><sc-if value="{{ ungekoppelt }}"><div style="display: flex; gap: 8px"><button type="button" onClick="{{ koppeln }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 3px; background: #6243c4; color: #ffffff; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 14.5px; font-weight: 700; white-space: nowrap; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); flex: 1 1 0; padding: 0 10px">Jetzt koppeln</button><button type="button" onClick="{{ scan }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border: 1.5px solid #1d2742; border-radius: 3px; background: #fffdf8; color: #1d2742; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; white-space: nowrap; flex: 1 1 0; min-height: 44px; padding: 0 10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"></path></svg>Jetzt scannen</button></div></sc-if><div style="flex: 1 1 auto"></div><span style="font-size: 11.5px; color: #5b6170">Kranich Agent {{ version }} · aus der origami-Familie</span><svg viewBox="0 0 100 100" width="54" height="54" aria-hidden="true" style="position: absolute; right: 0; bottom: 0; display: block; pointer-events: none; transform-origin: 100% 100%; animation: kEar .25s .45s both"><polygon points="100,38 100,100 38,100" fill="#f6f1e7"></polygon><polygon points="38,100 100,38 38,38" fill="#7c5cd6"></polygon><polygon points="38,100 38,38 69,69" fill="#4a2f9a"></polygon></svg></div></sc-if><sc-if value="{{ sKoppeln }}"><div style="position: relative; width: 100vw; height: 100vh; padding: 20px 24px 18px; background: #fffdf8; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; color: #1d2742; font-family: 'Source Serif 4', Georgia, serif; font-size: 13.5px; line-height: 1.45"><div style="display: flex; align-items: center; gap: 12px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="84" height="84" aria-hidden="true" style="display: block; flex: none"><ellipse cx="46" cy="87" rx="18" ry="2.4" fill="#1d2742" opacity="0.14"></ellipse><g><polygon points="40,58 43,58 41,86" fill="#6243c4"></polygon><polygon points="48,58 51,58 52,86" fill="#6243c4"></polygon><polygon points="12,50 30,46 30,58" fill="#4a2f9a"></polygon><polygon points="24,58 62,58 46,38" fill="#7c5cd6"></polygon><polygon points="56,56 62,58 64,9" fill="#4a2f9a"></polygon><polygon points="30,52 56,55 34,27" fill="#d6caf9"></polygon><polygon points="64,9 79,9 63,16" fill="#1d2742"></polygon></g></svg><h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; line-height: 1.15">Dieses Gerät mit deinem Kranich verbinden</h1></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="code" style="font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 700; font-size: 14px">Achtstelliger Code</label><input id="code" type="text" inputMode="numeric" maxLength="9" placeholder="0000 0000" style="min-height: 54px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1.5px solid #1d2742; border-radius: 3px; background: #ffffff; color: #1d2742; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .14em; text-align: center; border-color: {{ codeRand }}"><sc-if value="{{ fehlerAn }}"><span role="alert" style="display: flex; align-items: center; gap: 6px; color: #a5221b; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none"><path d="M12 4l9 16H3zM12 10v4M12 17v.5"></path></svg>{{ fehler }}</span></sc-if></div><span style="font-size: 12.5px; color: #4a4f5e">Den Code zeigt dir dein Kranich Host unter Einstellungen, Geräte, „Gerät hinzufügen“.</span><button type="button" onClick="{{ koppleJetzt }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 3px; background: #6243c4; color: #ffffff; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 14.5px; font-weight: 700; white-space: nowrap; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%)">{{ koppelText }}</button><button type="button" onClick="{{ zurueck }}" style="align-self: center; border: 0; background: none; padding: 6px 10px; color: #4a2f9a; font-family: 'Source Serif 4', Georgia, serif; font-size: 13px; text-decoration: underline; cursor: pointer">Später</button><div style="flex: 1 1 auto"></div><span style="font-size: 11.5px; color: #5b6170">Kranich Agent {{ version }} · aus der origami-Familie</span><svg viewBox="0 0 100 100" width="54" height="54" aria-hidden="true" style="position: absolute; right: 0; bottom: 0; display: block; pointer-events: none; transform-origin: 100% 100%; animation: kEar .25s .45s both"><polygon points="100,38 100,100 38,100" fill="#f6f1e7"></polygon><polygon points="38,100 100,38 38,38" fill="#7c5cd6"></polygon><polygon points="38,100 38,38 69,69" fill="#4a2f9a"></polygon></svg></div></sc-if><sc-if value="{{ sFertig }}"><div style="position: relative; width: 100vw; height: 100vh; padding: 20px 24px 18px; background: #fffdf8; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; color: #1d2742; font-family: 'Source Serif 4', Georgia, serif; font-size: 13.5px; line-height: 1.45"><div style="display: flex; align-items: center; gap: 12px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="84" height="84" aria-hidden="true" style="display: block; flex: none"><ellipse cx="46" cy="87" rx="18" ry="2.4" fill="#1d2742" opacity="0.14"></ellipse><g><polygon points="40,58 43,58 41,86" fill="#6243c4"></polygon><polygon points="48,58 51,58 52,86" fill="#6243c4"></polygon><polygon points="12,50 30,46 30,58" fill="#4a2f9a"></polygon><polygon points="24,58 62,58 46,38" fill="#7c5cd6"></polygon><polygon points="56,56 62,58 66,22" fill="#4a2f9a"></polygon><polygon points="30,52 56,55 38,32" fill="#d6caf9"></polygon><polygon points="66,22 80,27 65,29" fill="#1d2742"></polygon></g></svg><h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; line-height: 1.15">Dieses Gerät mit deinem Kranich verbinden</h1></div><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; background: #e0f3e4; border-radius: 3px"><span style="display: flex; align-items: center; gap: 8px; color: #17663a; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-weight: 800; font-size: 18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; flex: none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Gekoppelt als „{{ name }}“</span><span>Dein Host sieht dieses Gerät jetzt. Du kannst das Fenster schließen, Kranich läuft im Tray weiter.</span></div><button type="button" onClick="{{ zurueck }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 3px; background: #6243c4; color: #ffffff; font-family: 'Bricolage Grotesque', 'Segoe UI', sans-serif; font-size: 14.5px; font-weight: 700; white-space: nowrap; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%)">Fertig</button><div style="flex: 1 1 auto"></div><span style="font-size: 11.5px; color: #5b6170">Kranich Agent {{ version }} · aus der origami-Familie</span><svg viewBox="0 0 100 100" width="54" height="54" aria-hidden="true" style="position: absolute; right: 0; bottom: 0; display: block; pointer-events: none; transform-origin: 100% 100%; animation: kEar .25s .45s both"><polygon points="100,38 100,100 38,100" fill="#f6f1e7"></polygon><polygon points="38,100 100,38 38,38" fill="#7c5cd6"></polygon><polygon points="38,100 38,38 69,69" fill="#4a2f9a"></polygon></svg></div></sc-if></div></template>
