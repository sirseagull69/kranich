@keyframes kStampB{0%{opacity:0;transform:translateY(-46px) scale(2.1) rotate(-26deg)}55%{opacity:1;transform:translateY(0) scale(.93) rotate(-9deg);filter:saturate(1.8) brightness(.8)}75%{transform:scale(1.05) rotate(-9deg);filter:saturate(1.8) brightness(.8)}100%{opacity:1;transform:scale(1) rotate(-9deg);filter:none}}

@keyframes kPeck{0%,100%{transform:rotate(0)}50%{transform:rotate(70deg)}}
@keyframes kHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}70%{transform:translateY(0) scaleY(.94)}}

@keyframes kToastA{0%{opacity:0;transform:translateY(40px) rotate(-2deg)}6%{opacity:1;transform:translateY(0) rotate(0)}93%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(40px)}}
@keyframes kToastB{0%{opacity:0;transform:translateY(40px) rotate(-2deg)}6%{opacity:1;transform:translateY(0) rotate(0)}93%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(40px)}}
